name: Verificação

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testes das regras
        run: npm test
      - name: Tipos (TypeScript)
        run: npm run typecheck
      - name: Lint
        # cada problema vira uma anotação no arquivo/linha (aparece no PR)
        run: |
          npx eslint . -f json -o eslint.json || true
          node scripts/eslint-anotacoes.mjs
