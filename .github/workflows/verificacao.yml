name: Verificação

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testes das regras
        run: npm test
      - name: Tipos (TypeScript)
        run: npm run typecheck
      - name: Lint
        run: npm run lint
